  name: Traceable API Security Platform
  description: >-
    Traceable provides an intelligent API security platform offering API discovery, threat detection and
    protection, and API security testing. It uses distributed tracing and context-aware AI to understand
    API behavior, detect threats, and protect APIs across the full application lifecycle. The platform
    supports REST, SOAP, gRPC, GraphQL, and WebSocket APIs.
