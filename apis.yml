aid: traceable
name: Traceable
description: >-
  Traceable is an API security and observability platform that provides API discovery, threat detection, and protection
  across the full application lifecycle. It uses context-aware AI to detect and block API-based attacks while providing
  deep visibility into API behavior and risk. Traceable exposes public GraphQL APIs for configuration, analytics, and
  operational data access, as well as an MCP server with 12 tools for AI-assisted security workflows.
